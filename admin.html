<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - MGBK Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mgbk: { purple: '#6b21a8', violet: '#3b0764', dark: '#0f0716', blue: '#1e1b4b', yellow: '#eab308' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-mgbk-dark text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- TOP BAR -->
  <header class="py-4 px-6 bg-mgbk-violet/80 border-b border-purple-800/50 flex justify-between items-center backdrop-blur-md">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Logo" class="w-10 h-10 rounded-full ring-2 ring-mgbk-yellow bg-mgbk-blue p-0.5" />
      <h1 class="text-lg font-bold text-white">Panel Admin <span class="text-mgbk-yellow">MGBK</span></h1>
    </div>
    <button id="logout-btn" onclick="logout()" class="hidden bg-red-600/80 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-lg font-semibold transition-all">
      <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
    </button>
  </header>

  <!-- FORM LOGIN -->
  <div id="login-section" class="max-w-md w-full mx-auto p-6">
    <div class="bg-gradient-to-br from-purple-950/80 to-mgbk-blue/80 border border-purple-700/50 rounded-3xl p-8 shadow-2xl backdrop-blur-md">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-mgbk-yellow/10 border border-mgbk-yellow text-mgbk-yellow rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-xl font-bold text-white">Login Pengelola</h2>
        <p class="text-xs text-slate-400 mt-1">Masukkan akses admin MGBK Media</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-300 font-semibold mb-1">Username</label>
          <input type="text" id="login-user" required class="w-full bg-mgbk-dark/80 border border-purple-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow transition-colors" placeholder="Masukkan username..." />
        </div>
        <div>
          <label class="block text-xs text-slate-300 font-semibold mb-1">Password</label>
          <input type="password" id="login-pass" required class="w-full bg-mgbk-dark/80 border border-purple-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow transition-colors" placeholder="Masukkan password..." />
        </div>
        <button type="submit" id="login-btn" class="w-full bg-mgbk-yellow hover:bg-yellow-400 text-mgbk-dark font-extrabold py-3 rounded-xl text-xs shadow-lg transition-all flex items-center justify-center gap-2">
          <span>Masuk Admin</span>
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD UPLOAD (TERSEMBUNYI SBLM LOGIN) -->
  <div id="dashboard-section" class="hidden max-w-3xl w-full mx-auto p-4 md:p-6 my-6">
    <div class="bg-gradient-to-br from-purple-950/60 to-mgbk-blue/60 border border-purple-700/40 rounded-3xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
      
      <div class="border-b border-purple-800/60 pb-4 mb-6">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-mgbk-yellow"></i> Form Upload Dokumentasi Bulk
        </h2>
        <p class="text-xs text-slate-400 mt-1">Satu kali upload foto sekaligus banyak dengan deskripsi yang sama.</p>
      </div>

      <form onsubmit="handleUpload(event)" class="space-y-5">
        
        <!-- Nama Kegiatan / Folder -->
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Nama Kegiatan / Album <span class="text-red-400">*</span></label>
          <input type="text" id="upload-judul" required placeholder="Contoh: RAFTING CIKOLE, WORKSHOP BK 2026" class="w-full bg-mgbk-dark/90 border border-purple-700/60 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow" />
        </div>

        <!-- Tanggal Kegiatan -->
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Tanggal Kegiatan <span class="text-red-400">*</span></label>
          <input type="date" id="upload-tanggal" required class="w-full bg-mgbk-dark/90 border border-purple-700/60 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow" />
        </div>

        <!-- Deskripsi Otomatis -->
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Keterangan / Deskripsi (Otomatis untuk semua foto) <span class="text-red-400">*</span></label>
          <textarea id="upload-deskripsi" rows="3" required placeholder="Keterangan singkat kegiatan..." class="w-full bg-mgbk-dark/90 border border-purple-700/60 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow"></textarea>
        </div>

        <!-- Link Video Optional -->
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Link Video YouTube / Drive (Opsional)</label>
          <input type="url" id="upload-video" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-mgbk-dark/90 border border-purple-700/60 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-mgbk-yellow" />
        </div>

        <!-- Multiple File Upload -->
        <div>
          <label class="block text-xs font-semibold text-purple-200 mb-1">Pilih File Foto Sekaligus (Bisa banyak sekaligus) <span class="text-red-400">*</span></label>
          <input type="file" id="upload-files" multiple accept="image/*" required class="w-full text-xs text-slate-300 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-purple-900 file:text-mgbk-yellow hover:file:bg-purple-800 cursor-pointer bg-mgbk-dark/90 border border-purple-700/60 rounded-xl p-2" />
          <p id="file-count-info" class="text-[11px] text-mgbk-yellow mt-1 font-medium"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-upload-btn" class="w-full bg-mgbk-yellow hover:bg-yellow-400 text-mgbk-dark font-extrabold py-3 rounded-xl text-xs shadow-xl transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-upload"></i> Unggah Dokumentasi
        </button>

      </form>

      <div id="status-message" class="mt-4 text-center text-xs font-semibold hidden p-3 rounded-xl"></div>

    </div>
  </div>

  <footer class="py-4 text-center text-slate-500 text-[11px]">
    MGBK Media & IT Hub Admin Panel &copy; 2026
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw5FO88o7tlkHfUQdLRLyWwTDUlYRnmNBpA-EC1TvIMvzY4Xg2G24xRufnm6p3Lk26A/exec";

    // Cek Sesi Login
    if (sessionStorage.getItem('mgbk_admin_logged') === 'true') {
      showDashboard();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;
      const btn = document.getElementById('login-btn');

      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...`;

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username: u, password: p })
        });
        const result = await res.json();

        if (result.status === 'success') {
          sessionStorage.setItem('mgbk_admin_logged', 'true');
          showDashboard();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server!");
      } finally {
        btn.innerHTML = `<span>Masuk Admin</span>`;
      }
    }

    function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      document.getElementById('logout-btn').classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('mgbk_admin_logged');
      location.reload();
    }

    // Menampilkan jumlah file yang dipilih
    document.getElementById('upload-files').addEventListener('change', (e) => {
      const count = e.target.files.length;
      document.getElementById('file-count-info').innerText = count > 0 ? ` Terpilih ${count} file foto` : '';
    });

    // Helper Convert File ke Base64
    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve({ name: file.name, type: file.type, base64: reader.result });
      reader.onerror = error => reject(error);
    });

    async function handleUpload(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-upload-btn');
      const status = document.getElementById('status-message');
      const filesInput = document.getElementById('upload-files').files;

      if (filesInput.length === 0) return;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah ${filesInput.length} foto ke Drive...`;
      status.className = "mt-4 text-center text-xs font-semibold p-3 rounded-xl bg-purple-900/60 text-purple-200 block";
      status.innerText = "Memproses dan mengonversi file, mohon tunggu sebentar...";

      try {
        const filePromises = Array.from(filesInput).map(file => fileToBase64(file));
        const encodedFiles = await Promise.all(filePromises);

        const payload = {
          action: 'uploadFiles',
          judul: document.getElementById('upload-judul').value,
          tanggal: document.getElementById('upload-tanggal').value,
          deskripsi: document.getElementById('upload-deskripsi').value,
          videoUrl: document.getElementById('upload-video').value,
          files: encodedFiles
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          status.className = "mt-4 text-center text-xs font-semibold p-3 rounded-xl bg-green-950 border border-green-700 text-green-300 block";
          status.innerText = " " + result.message;
          e.target.reset();
          document.getElementById('file-count-info').innerText = '';
        } else {
          throw new Error(result.message);
        }

      } catch (err) {
        status.className = "mt-4 text-center text-xs font-semibold p-3 rounded-xl bg-red-950 border border-red-700 text-red-300 block";
        status.innerText = " Gagal mengunggah: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-upload"></i> Unggah Dokumentasi`;
      }
    }
  </script>
</body>
</html>
