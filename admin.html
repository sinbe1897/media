<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MGBK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0d0614;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card-glass {
      background: rgba(25, 12, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 92, 246, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .custom-input {
      background: rgba(15, 7, 24, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #f8fafc;
      transition: all 0.3s ease;
    }
    .custom-input:focus {
      border-color: #f59e0b;
      outline: none;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }
    /* Toast Notification Animation */
    #toast {
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.4s ease;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl card-glass border-l-4">
    <i id="toast-icon" class="fas text-xl"></i>
    <div>
      <h4 id="toast-title" class="font-bold text-sm">Notifikasi</h4>
      <p id="toast-msg" class="text-xs text-gray-300"></p>
    </div>
  </div>

  <header class="card-glass border-b border-purple-900/30 sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 p-2 rounded-lg text-black font-bold">
        <i class="fas fa-user-shield"></i>
      </div>
      <h1 class="text-xl font-bold tracking-wide text-white">Panel Admin <span class="text-amber-500">MGBK</span></h1>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8 space-y-8">

    <section class="card-glass rounded-2xl p-6 relative overflow-hidden">
      <div class="flex items-center justify-between mb-6 pb-3 border-b border-purple-900/40">
        <div class="flex items-center gap-3">
          <i class="fas fa-newspaper text-amber-500 text-2xl"></i>
          <div>
            <h2 id="form-title" class="text-lg font-bold text-white">Kelola Artikel / Berita</h2>
            <p class="text-xs text-gray-400">Publikasikan informasi atau kabar terbaru MGBK.</p>
          </div>
        </div>
        <button id="btn-cancel-edit" onclick="resetFormArtikel()" class="hidden text-xs bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded-lg transition">
          <i class="fas fa-times mr-1"></i> Batal Edit
        </button>
      </div>

      <form id="form-artikel" onsubmit="submitArtikel(event)" class="space-y-4">
        <input type="hidden" id="artikel-id" value="">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-300 font-semibold mb-1">Judul Artikel / Berita *</label>
            <input type="text" id="art-judul" required placeholder="Judul berita..." class="w-full custom-input px-4 py-2.5 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-300 font-semibold mb-1">Kategori *</label>
            <input type="text" id="art-kategori" required placeholder="Misal: WORKSHOP, AGENDA, INFO" class="w-full custom-input px-4 py-2.5 rounded-xl text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-300 font-semibold mb-1">Tanggal *</label>
            <input type="date" id="art-tanggal" required class="w-full custom-input px-4 py-2.5 rounded-xl text-sm">
          </div>
          <div>
            <label class="block text-xs text-gray-300 font-semibold mb-1">Upload Banner / Gambar Artikel *</label>
            <input type="file" id="art-gambar-file" accept="image/*" class="w-full custom-input px-3 py-1.5 rounded-xl text-xs file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-black hover:file:bg-amber-400">
            <p class="text-[10px] text-gray-400 mt-1">*Pilih berkas foto langsung dari perangkat Anda.</p>
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-300 font-semibold mb-1">Ringkasan / Isi Singkat *</label>
          <textarea id="art-ringkasan" rows="3" required placeholder="Tuliskan isi ringkas artikel..." class="w-full custom-input px-4 py-2.5 rounded-xl text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs text-gray-300 font-semibold mb-1">Link Baca Selengkapnya (Opsional)</label>
          <input type="url" id="art-link" placeholder="https://..." class="w-full custom-input px-4 py-2.5 rounded-xl text-sm">
        </div>

        <button type="submit" id="btn-submit-artikel" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl transition duration-300 flex justify-center items-center gap-2 shadow-lg shadow-amber-500/20">
          <i class="fas fa-paper-plane"></i>
          <span id="btn-text">Simpan Artikel</span>
        </button>
      </form>
    </section>

    <section class="card-glass rounded-2xl p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-md font-bold text-white flex items-center gap-2">
          <i class="fas fa-list text-amber-500"></i> Daftar Artikel Dikirim
        </h3>
        <button onclick="loadDaftarArtikel()" class="text-xs text-amber-400 hover:underline">
          <i class="fas fa-sync-alt mr-1"></i> Refresh
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-purple-950/60 text-gray-300 uppercase">
            <tr>
              <th class="p-3">Judul</th>
              <th class="p-3">Kategori</th>
              <th class="p-3">Tanggal</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-artikel-body" class="divide-y divide-purple-900/30">
            <tr>
              <td colspan="4" class="text-center p-4 text-gray-400">Memuat data artikel...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    // URL API APPS SCRIPT KAKAK
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwy4YqgUa8S-1jJ-M16mXpI0z2eTjYyVvP_/exec";

    // NOTIFIKASI TOAST CUSTOM
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const title = document.getElementById('toast-title');
      const msg = document.getElementById('toast-msg');

      if (isSuccess) {
        toast.className = "fixed top-5 right-5 z-50 transform translate-x-0 opacity-100 flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl card-glass border-l-4 border-emerald-500 text-emerald-400";
        icon.className = "fas fa-check-circle text-emerald-400 text-xl";
        title.innerText = "Berhasil!";
      } else {
        toast.className = "fixed top-5 right-5 z-50 transform translate-x-0 opacity-100 flex items-center gap-3 px-5 py-4 rounded-xl shadow-2xl card-glass border-l-4 border-rose-500 text-rose-400";
        icon.className = "fas fa-exclamation-circle text-rose-400 text-xl";
        title.innerText = "Gagal!";
      }

      msg.innerText = message;

      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
      }, 4000);
    }

    // SIMPAN / UPDATE ARTIKEL
    async function submitArtikel(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit-artikel');
      const btnText = document.getElementById('btn-text');
      
      const id = document.getElementById('artikel-id').value;
      const judul = document.getElementById('art-judul').value;
      const kategori = document.getElementById('art-kategori').value;
      const tanggal = document.getElementById('art-tanggal').value;
      const ringkasan = document.getElementById('art-ringkasan').value;
      const link = document.getElementById('art-link').value;
      const fileInput = document.getElementById('art-gambar-file');

      btn.disabled = true;
      btnText.innerText = "Memproses...";

      try {
        let gambarBase64 = null;
        let gambarType = null;

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          gambarType = file.type;
          gambarBase64 = await convertFileToBase64(file);
        }

        const payload = {
          action: id ? "updateArtikel" : "addArtikel",
          id: id,
          judul: judul,
          kategori: kategori,
          tanggal: tanggal,
          ringkasan: ringkasan,
          link: link,
          gambarBase64: gambarBase64,
          gambarType: gambarType
        };

        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.status === "success") {
          showToast(result.message, true);
          resetFormArtikel();
          loadDaftarArtikel();
        } else {
          showToast(result.message || "Terjadi kesalahan!", false);
        }
      } catch (err) {
        showToast("Gagal terhubung ke server: " + err.message, false);
      } finally {
        btn.disabled = false;
        btnText.innerText = id ? "Perbarui Artikel" : "Simpan Artikel";
      }
    }

    // CONVERT FILE KE BASE64
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // RESET FORM
    function resetFormArtikel() {
      document.getElementById('form-artikel').reset();
      document.getElementById('artikel-id').value = "";
      document.getElementById('form-title').innerText = "Kelola Artikel / Berita";
      document.getElementById('btn-text').innerText = "Simpan Artikel";
      document.getElementById('btn-cancel-edit').classList.add('hidden');
    }

    // MEMUAT DAFTAR ARTIKEL
    async function loadDaftarArtikel() {
      const tbody = document.getElementById('tabel-artikel-body');
      tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data artikel...</td></tr>`;

      try {
        const res = await fetch(`${GAS_API_URL}?action=getArtikel`);
        const articles = await res.json();

        if (!Array.isArray(articles) || articles.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-gray-400">Belum ada artikel.</td></tr>`;
          return;
        }

        tbody.innerHTML = articles.map(item => `
          <tr class="hover:bg-purple-900/20 border-b border-purple-900/20">
            <td class="p-3 font-semibold text-white">${item.judul}</td>
            <td class="p-3"><span class="bg-purple-900/60 text-purple-300 px-2 py-1 rounded text-[10px]">${item.kategori}</span></td>
            <td class="p-3 text-gray-400">${item.tanggal}</td>
            <td class="p-3 text-center space-x-2">
              <button onclick='prepareEdit(${JSON.stringify(item)})' class="bg-blue-600/80 hover:bg-blue-600 text-white px-2.5 py-1 rounded text-[10px]">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button onclick="deleteArtikel('${item.id}')" class="bg-rose-600/80 hover:bg-rose-600 text-white px-2.5 py-1 rounded text-[10px]">
                <i class="fas fa-trash"></i> Hapus
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-rose-400">Gagal memuat artikel!</td></tr>`;
      }
    }

    // PREPARE EDIT
    function prepareEdit(item) {
      document.getElementById('artikel-id').value = item.id;
      document.getElementById('art-judul').value = item.judul;
      document.getElementById('art-kategori').value = item.kategori;
      document.getElementById('art-ringkasan').value = item.ringkasan;
      document.getElementById('art-link').value = item.link || item.linkBaca || "";
      
      document.getElementById('form-title').innerText = "Edit Artikel";
      document.getElementById('btn-text').innerText = "Perbarui Artikel";
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // HAPUS ARTIKEL
    async function deleteArtikel(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus artikel ini?")) return;

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "deleteArtikel", id: id })
        });
        const result = await res.json();
        if (result.status === "success") {
          showToast(result.message, true);
          loadDaftarArtikel();
        } else {
          showToast(result.message, false);
        }
      } catch (err) {
        showToast("Gagal menghapus: " + err.message, false);
      }
    }

    // INIT INITIAL LOAD
    document.addEventListener("DOMContentLoaded", () => {
      loadDaftarArtikel();
    });
  </script>
</body>
</html>
